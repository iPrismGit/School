[versions]
agp = "8.13.2"
kotlin = "2.3.0"
coreKtx = "1.17.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
material = "1.13.0"
activity = "1.12.2"
constraintlayout = "2.2.1"
circleimageview = "3.1.0"
pinview = "1.4.4"
avloading = "2.3.0"
androidImageSlider = "1.4.1"
swipeRefreshLayout = "1.2.0"
photoview = "2.3.0"
ucrop = "2.2.11"
shimmer = "0.5.0"
retrofit = "3.0.0"
lifecycle = "2.10.0"
appupdate = "2.1.0"
glide = "5.0.5"
navigationFragmentKtx = "2.9.6"
navigationUiKtx = "2.9.6"
exoplayer = "2.19.1"
codeScanner = "2.3.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
circleimageview = { module = "de.hdodenhof:circleimageview", version.ref = "circleimageview" }
pinview = { module = "io.github.chaosleung:pinview", version.ref = "pinview" }
avloading = { module = "io.github.maitrungduc1410:AVLoadingIndicatorView", version.ref = "avloading" }
android-image-slider = { module = "com.github.koai-dev:Android-Image-Slider", version.ref = "androidImageSlider" }
swipe-refresh-layout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "swipeRefreshLayout" }
photoview = { module = "com.github.chrisbanes:PhotoView", version.ref = "photoview" }
ucrop = { module = "com.github.yalantis:ucrop", version.ref = "ucrop" }
facebook-shimmer = { module = "com.facebook.shimmer:shimmer", version.ref = "shimmer" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
app-update = { module = "com.google.android.play:app-update", version.ref = "appupdate" }
bumptech-glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
google-play-base = { module = "com.google.android.gms:play-services-base", version = "18.5.0" }
google-play-location = { module = "com.google.android.gms:play-services-location", version = "21.3.0" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging", version = "24.0.0" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics", version = "22.0.2" }
exo-player ={module = "com.google.android.exoplayer:exoplayer", version.ref = "exoplayer"}
exo-player-ui ={module = "com.google.android.exoplayer:exoplayer-ui", version.ref = "exoplayer"}
androidx-navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigationFragmentKtx" }
androidx-navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigationUiKtx" }
code-scanner = { module = "com.github.yuriy-budiyev:code-scanner", version.ref = "codeScanner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

